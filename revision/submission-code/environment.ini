"""
=============================================================
AMMARL-PI: Resilient Military Supply Chain Routing
Phase 1 — Military Logistics Environment
=============================================================
Paper: Resilient Military Supply Chain Routing via Adversarial
       Multi-Agent Reinforcement Learning in Physical Internet Networks

What this file does:
- Builds the military logistics map (nodes = bases, edges = routes)
- Assigns properties: threat level, congestion, travel cost, capacity
- Simulates the RED agent blocking routes
- Simulates BLUE agents trying to deliver supplies
- Visualizes the network map
=============================================================
"""

import numpy as np
import networkx as nx
import matplotlib.pyplot as plt
import matplotlib.patches as mpatches
import random

# ─────────────────────────────────────────────
# STEP 1: Define the Military Logistics Network
# ─────────────────────────────────────────────

class MilitaryLogisticsEnv:
    """
    The 'world' where our simulation runs.

    Nodes = Military bases / depots / warehouses
    Edges = Roads / supply routes between them

    Each route has:
        - travel_cost   : fuel/time cost to use this route
        - threat_level  : probability enemy attacks this route (0.0 to 1.0)
        - congestion    : how busy the route is (0.0 to 1.0)
        - capacity      : max supply units the route can carry
        - active        : True = open, False = blocked by red agent
    """

    def __init__(self, num_nodes=10, num_blue_agents=3, comm_budget=2, seed=42):
        random.seed(seed)
        np.random.seed(seed)

        self.num_nodes      = num_nodes
        self.num_blue       = num_blue_agents
        self.comm_budget    = comm_budget   # max neighbors each agent can talk to
        self.graph          = nx.DiGraph()  # directed graph (routes have direction)

        # Special nodes
        self.depot          = 0             # where supplies START (main base)
        self.targets        = [7, 8, 9]     # frontline bases needing supplies

        self._build_network()
        self._initialize_agents()

        # Tracking metrics for the paper
        self.metrics = {
            "deliveries_completed" : 0,
            "deliveries_failed"    : 0,
            "total_cost"           : 0.0,
            "routes_blocked"       : 0,
            "steps"                : 0
        }

    # ─────────────────────────────────────────
    # BUILD THE MAP
    # ─────────────────────────────────────────

    def _build_network(self):
        """Create nodes and routes with military properties."""

        # Node types: 0=Main Depot, 1-6=Intermediate Hubs, 7-9=Frontline Bases
        node_types = {
            0: "Main Depot",
            1: "Hub Alpha", 2: "Hub Bravo", 3: "Hub Charlie",
            4: "Hub Delta", 5: "Hub Echo",  6: "Hub Foxtrot",
            7: "Frontline Base 1", 8: "Frontline Base 2", 9: "Frontline Base 3"
        }

        # Add nodes with positions for visualization
        positions = {
            0: (0, 2),    # Depot — left center
            1: (1, 4),    2: (1, 2),    3: (1, 0),
            4: (2.5, 3),  5: (2.5, 1),
            6: (4, 2),
            7: (5.5, 4),  8: (5.5, 2),  9: (5.5, 0)
        }

        for node_id, label in node_types.items():
            self.graph.add_node(
                node_id,
                label    = label,
                pos      = positions[node_id],
                queue    = 0,       # supply units waiting at this node
                active   = True     # node can be destroyed by red agent
            )

        # Define supply routes (from_node, to_node)
        # Each route gets random but realistic military properties
        route_list = [
            (0,1),(0,2),(0,3),          # Depot to hubs
            (1,4),(2,4),(2,5),(3,5),    # Hubs to mid-hubs
            (4,6),(5,6),                # Mid-hubs to forward hub
            (4,7),(6,7),(6,8),(6,9),(5,9)  # Forward to frontlines
        ]

        for (u, v) in route_list:
            # Add both directions (supply can reroute)
            for src, dst in [(u,v), (v,u)]:
                self.graph.add_edge(
                    src, dst,
                    travel_cost  = round(random.uniform(1.0, 5.0), 2),
                    threat_level = round(random.uniform(0.05, 0.6), 2),
                    congestion   = round(random.uniform(0.0, 0.4), 2),
                    capacity     = random.randint(3, 10),
                    active       = True   # red agent can set this to False
                )

    # ─────────────────────────────────────────
    # INITIALIZE AGENTS
    # ─────────────────────────────────────────

    def _initialize_agents(self):
        """Place blue agents at depot, red agent observing the network."""

        # BLUE agents — each carries supplies from depot to a target
        self.blue_agents = []
        for i in range(self.num_blue):
            agent = {
                "id"          : i,
                "position"    : self.depot,
                "target"      : self.targets[i % len(self.targets)],
                "supplies"    : 5,          # units of supply being carried
                "path"        : [],         # route taken so far
                "delivered"   : False,
                "failed"      : False,
                "total_cost"  : 0.0,
                "comm_used"   : 0           # communication budget used this step
            }
            self.blue_agents.append(agent)

        # RED agent — has a budget to block routes each episode
        self.red_agent = {
            "block_budget"    : 3,          # can block up to 3 routes per episode
            "blocked_routes"  : [],
            "destroyed_nodes" : []
        }

    # ─────────────────────────────────────────
    # RED AGENT ACTION
    # ─────────────────────────────────────────

    def red_agent_act(self):
        """
        Red agent strategically blocks the highest-threat routes.
        This simulates enemy interdiction.
        """
        active_edges = [
            (u, v) for u, v, d in self.graph.edges(data=True)
            if d["active"] and d["threat_level"] > 0.4
        ]

        # Sort by threat level — red attacks highest threat routes first
        active_edges.sort(
            key=lambda e: self.graph[e[0]][e[1]]["threat_level"],
            reverse=True
        )

        blocked = []
        for u, v in active_edges[:self.red_agent["block_budget"]]:
            self.graph[u][v]["active"] = False
            blocked.append((u, v))
            self.metrics["routes_blocked"] += 1

        self.red_agent["blocked_routes"] = blocked

        print(f"\n🔴 RED AGENT blocked {len(blocked)} routes: {blocked}")
        return blocked

    # ─────────────────────────────────────────
    # BLUE AGENT ACTION (Simple Greedy Routing)
    # ─────────────────────────────────────────

    def blue_agent_act(self, agent):
        """
        Blue agent finds the shortest safe path to its target.
        Uses survivability-weighted cost (our novel reward signal).
        """
        pos    = agent["position"]
        target = agent["target"]

        if pos == target:
            agent["delivered"] = True
            self.metrics["deliveries_completed"] += 1
            print(f"  ✅ Blue Agent {agent['id']} delivered to Node {target}!")
            return

        # Build a subgraph of only ACTIVE routes
        active_graph = nx.DiGraph()
        for u, v, d in self.graph.edges(data=True):
            if d["active"] and self.graph.nodes[u]["active"]:
                # Survivability-weighted cost (our paper's key formula component)
                # Higher threat = higher effective cost = agent avoids it
                weight = (
                    d["travel_cost"] +
                    5.0 * d["threat_level"] +   # alpha * T
                    2.0 * d["congestion"]        # gamma * Q
                )
                active_graph.add_edge(u, v, weight=weight)

        # Find best path
        try:
            path = nx.dijkstra_path(active_graph, pos, target, weight="weight")
            next_node = path[1]

            # Move agent one step along path
            edge = self.graph[pos][next_node]
            agent["total_cost"] += edge["travel_cost"]
            agent["path"].append(next_node)
            agent["position"] = next_node

            # XRL Explanation (Contribution 4)
            threat = edge["threat_level"]
            cong   = edge["congestion"]
            cost   = edge["travel_cost"]
            print(f"  🔵 Agent {agent['id']}: {pos}→{next_node} | "
                  f"cost={cost} threat={threat} congestion={cong} | "
                  f"Reason: {'HIGH THREAT but only path' if threat>0.4 else 'Safest available route'}")

        except nx.NetworkXNoPath:
            agent["failed"] = True
            self.metrics["deliveries_failed"] += 1
            print(f"  ❌ Agent {agent['id']}: No path to target {target}! Route cut off.")

    # ─────────────────────────────────────────
    # RUN ONE EPISODE
    # ─────────────────────────────────────────

    def run_episode(self, max_steps=15):
        """Run one full simulation episode."""
        print("\n" + "="*60)
        print("  EPISODE START — Military Logistics Simulation")
        print("="*60)

        # Red agent strikes first
        self.red_agent_act()

        for step in range(max_steps):
            self.metrics["steps"] += 1
            print(f"\n--- Step {step+1} ---")

            all_done = True
            for agent in self.blue_agents:
                if not agent["delivered"] and not agent["failed"]:
                    all_done = False
                    self.blue_agent_act(agent)

            if all_done:
                print("\n✅ All agents finished!")
                break

        self._print_summary()

    # ─────────────────────────────────────────
    # SUMMARY REPORT
    # ─────────────────────────────────────────

    def _print_summary(self):
        print("\n" + "="*60)
        print("  EPISODE SUMMARY")
        print("="*60)
        print(f"  Deliveries Completed : {self.metrics['deliveries_completed']}")
        print(f"  Deliveries Failed    : {self.metrics['deliveries_failed']}")
        print(f"  Routes Blocked       : {self.metrics['routes_blocked']}")
        print(f"  Total Steps          : {self.metrics['steps']}")
        for agent in self.blue_agents:
            status = "✅ Delivered" if agent["delivered"] else ("❌ Failed" if agent["failed"] else "⏳ In Progress")
            print(f"  Agent {agent['id']} → Target {agent['target']} | "
                  f"Cost: {agent['total_cost']:.2f} | Path: {[0]+agent['path']} | {status}")

    # ─────────────────────────────────────────
    # VISUALIZATION
    # ─────────────────────────────────────────

    def visualize(self, title="Military Logistics Network"):
        """Draw the logistics network map."""
        fig, ax = plt.subplots(1, 1, figsize=(14, 8))
        pos = nx.get_node_attributes(self.graph, "pos")

        # Node colors by type
        node_colors = []
        for n in self.graph.nodes():
            if n == self.depot:
                node_colors.append("#2196F3")       # Blue = Main Depot
            elif n in self.targets:
                node_colors.append("#F44336")       # Red = Frontline
            else:
                node_colors.append("#FF9800")       # Orange = Hub

        # Edge colors by status and threat
        edge_colors, edge_widths, edge_styles = [], [], []
        for u, v, d in self.graph.edges(data=True):
            if not d["active"]:
                edge_colors.append("#B71C1C")       # Dark red = blocked
                edge_widths.append(2.5)
                edge_styles.append("dashed")
            elif d["threat_level"] > 0.4:
                edge_colors.append("#FF5722")       # Orange-red = high threat
                edge_widths.append(2.0)
                edge_styles.append("solid")
            else:
                edge_colors.append("#4CAF50")       # Green = safe
                edge_widths.append(1.5)
                edge_styles.append("solid")

        # Draw network
        nx.draw_networkx_nodes(self.graph, pos, node_color=node_colors,
                               node_size=800, ax=ax, alpha=0.95)
        nx.draw_networkx_labels(self.graph, pos,
                                labels=nx.get_node_attributes(self.graph, "label"),
                                font_size=7, font_weight="bold", ax=ax)

        # Draw edges (solid and dashed separately)
        solid_edges  = [(u,v) for (u,v,d) in self.graph.edges(data=True) if d["active"]]
        blocked_edges= [(u,v) for (u,v,d) in self.graph.edges(data=True) if not d["active"]]
        solid_colors = [c for c,s in zip(edge_colors, edge_styles) if s=="solid"]
        solid_widths = [w for w,s in zip(edge_widths, edge_styles) if s=="solid"]

        nx.draw_networkx_edges(self.graph, pos, edgelist=solid_edges,
                               edge_color=solid_colors, width=solid_widths,
                               arrows=True, arrowsize=15,
                               connectionstyle="arc3,rad=0.1", ax=ax)
        nx.draw_networkx_edges(self.graph, pos, edgelist=blocked_edges,
                               edge_color="#B71C1C", width=2.5, style="dashed",
                               arrows=True, arrowsize=15,
                               connectionstyle="arc3,rad=0.1", ax=ax)

        # Draw agent paths
        colors = ["#00BCD4", "#9C27B0", "#FFEB3B"]
        for agent in self.blue_agents:
            if agent["path"]:
                full_path = [self.depot] + agent["path"]
                path_edges = [(full_path[i], full_path[i+1])
                              for i in range(len(full_path)-1)]
                nx.draw_networkx_edges(self.graph, pos, edgelist=path_edges,
                                       edge_color=colors[agent["id"] % len(colors)],
                                       width=4, arrows=True, arrowsize=20,
                                       connectionstyle="arc3,rad=0.2", ax=ax)

        # Edge threat labels
        edge_labels = {(u,v): f"T:{d['threat_level']}"
                       for u,v,d in self.graph.edges(data=True)}
        nx.draw_networkx_edge_labels(self.graph, pos, edge_labels=edge_labels,
                                     font_size=6, ax=ax)

        # Legend
        legend_elements = [
            mpatches.Patch(color="#2196F3", label="Main Depot"),
            mpatches.Patch(color="#F44336", label="Frontline Base"),
            mpatches.Patch(color="#FF9800", label="Logistics Hub"),
            mpatches.Patch(color="#4CAF50", label="Safe Route"),
            mpatches.Patch(color="#FF5722", label="High Threat Route"),
            mpatches.Patch(color="#B71C1C", label="Blocked by Red Agent"),
            mpatches.Patch(color="#00BCD4", label="Agent 0 Path"),
            mpatches.Patch(color="#9C27B0", label="Agent 1 Path"),
            mpatches.Patch(color="#FFEB3B", label="Agent 2 Path"),
        ]
        ax.legend(handles=legend_elements, loc="upper left", fontsize=8)
        ax.set_title(title, fontsize=13, fontweight="bold", pad=15)
        ax.axis("off")
        plt.tight_layout()
        plt.savefig("/mnt/user-data/outputs/phase1_network_map.png", dpi=150, bbox_inches="tight")
        plt.close()
        print("\n📊 Network map saved!")


# ─────────────────────────────────────────────
# RUN EVERYTHING
# ─────────────────────────────────────────────

if __name__ == "__main__":
    env = MilitaryLogisticsEnv(num_nodes=10, num_blue_agents=3, comm_budget=2)
    env.run_episode(max_steps=15)
    env.visualize(title="AMMARL-PI: Military Logistics Network — Phase 1")